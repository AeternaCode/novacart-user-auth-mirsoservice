spring.application.name=user-auth-service

server.port=8082

# Database Config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.pagination.default-page-size=10
app.pagination.max-page-size=100

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=4

# JWT Configuration
app.jwt.secret=${JWT_SECRET}

# 2 minutes (120000 ms)
app.jwt.access-token-expiration=120000

# 30 days (2592000000 ms)
app.jwt.refresh-token-expiration=2592000000